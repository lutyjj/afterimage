# A two-by-two grid of items.
trmnl: |
  <div class="layout layout--col gap" style="justify-content:flex-start;align-items:flex-start">
  <div class="grid grid--cols-2" style="width:100%">
  <div class="item"><div class="meta"></div><div class="content"><span class="value">12°</span><span class="label label--small">Outside</span></div></div>
  <div class="item"><div class="meta"></div><div class="content"><span class="value">21°</span><span class="label label--small">Living room</span></div></div>
  <div class="item"><div class="meta"></div><div class="content"><span class="value">48%</span><span class="label label--small">Humidity</span></div></div>
  <div class="item"><div class="meta"></div><div class="content"><span class="value">1012</span><span class="label label--small">Pressure hPa</span></div></div>
  </div>
  </div>
afterimage:
  content:
    column:
      children:
        - grid:
            columns: 2
            cells:
              - content: { item: { children: [{ value: { text: 12° } }, { label: { text: Outside, size: small } }] } }
              - content: { item: { children: [{ value: { text: 21° } }, { label: { text: Living room, size: small } }] } }
              - content: { item: { children: [{ value: { text: 48% } }, { label: { text: Humidity, size: small } }] } }
              - content: { item: { children: [{ value: { text: "1012" } }, { label: { text: Pressure hPa, size: small } }] } }
# The profiles it is drawn on, each with the share of pixels, in percent, that
# may differ from TRMNL's rendering.
limits:
  og_png/bw: 0.13
  og_plus/gray-4: 0.46
  v2/bw: 0.11
  v2/gray-4: 0.26
