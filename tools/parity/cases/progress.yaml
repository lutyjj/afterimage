# Progress bars, base and large with emphasis.
trmnl: |
  <div class="layout layout--col gap" style="justify-content:flex-start;align-items:flex-start">
  <div class="progress-bar" style="width:100%"><div class="content"><span class="label">Battery</span><span class="value value--xxsmall">64%</span></div><div class="track"><div class="fill" style="width: 64%"></div></div></div>
  <div class="progress-bar progress-bar--large progress-bar--emphasis-3" style="width:100%"><div class="content"><span class="label">Disk</span><span class="value value--xxsmall">25%</span></div><div class="track"><div class="fill" style="width: 25%"></div></div></div>
  </div>
afterimage:
  content:
    column:
      children:
        - progressBar: { value: "64", label: Battery, figure: 64% }
        - progressBar: { value: "25", size: large, emphasis: 3, label: Disk, figure: 25% }
# The share of pixels, in percent, that may differ from TRMNL's rendering.
limits:
  og_png/bw: 0.014
  og_plus/gray-4: 0.011
  v2/bw: 1.6
  v2/gray-4: 3.2
