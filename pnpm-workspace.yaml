# linen, whose dependencies the web UI's build needs.
packages:
  - web
  - gen/management-client
  - gen/linen
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.106.1'
  - '@tanstack/react-query@5.106.1'
  - vite@8.3.6
