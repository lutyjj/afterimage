name: Release

# Every push to main refreshes the release pull request that Release Please
# keeps from the Conventional Commits since the last release: the version in
# Cargo.toml and Cargo.lock, and CHANGELOG.md. Merging it tags vX.Y.Z and
# drafts the release with the changelog's notes. The same run then builds the
# image on each architecture from the locked dependencies, which runs the web
# UI's tests, publishes it to the GitHub Container Registry under the version
# and `latest`, attaches the management API's OpenAPI document for scripts and
# publishes the release. It all runs here because a tag or release made with
# the workflow's token starts no other workflow.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # writes the release branch and tag, drafts the release
      issues: write # labels the release pull request
      pull-requests: write # opens and updates the release pull request
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # checks out the repository
      packages: write # pushes the image
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      # The runner's free disk is too small for the Rust build; this pools it
      # into /nix and builds in /nix/build.
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: build-dir = /nix/build
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: afterimage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check the tag
        run: |
          version=$(nix eval --raw .#container.imageTag)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not name the version in Cargo.toml, $version"
            exit 1
          fi
      - name: Build the image
        run: nix build .#container
      - name: Push the image
        env:
          ARCH: ${{ matrix.arch }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        # The source is the archive this job built, so there is no signature
        # for a policy to check.
        run: |
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- --insecure-policy "$@"; }
          echo "$REGISTRY_PASSWORD" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          skopeo copy docker-archive:result "docker://ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}-$ARCH"

  release:
    needs: [release-please, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # checks out the repository and publishes the release
      packages: write # tags the image of both architectures
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build the API documents
        run: nix build .#contract
      - name: Tag the image of both architectures
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker buildx imagetools create --tag "$image:$version" --tag "$image:latest" \
            "$image:$version-amd64" "$image:$version-arm64"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" result/management-api.openapi.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Afterimage ${TAG#v}" --draft=false
