name: Release

# Publishes a release Release Please has tagged and drafted: builds the image on
# each architecture from the locked dependencies, which runs the web UI's tests,
# publishes it to the GitHub Container Registry under the version and `latest`,
# attaches the management API's OpenAPI document for scripts and publishes the
# release. Release Please calls it; run it by hand with a tag to publish that
# tag again.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, such as v0.1.3
        type: string
        required: true

permissions: {}

jobs:
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # checks out the repository
      packages: write # pushes the image
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # The runner's free disk is too small for the Rust build; this pools it
      # into /nix and builds in /nix/build.
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: build-dir = /nix/build
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: afterimage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check the tag
        run: |
          version=$(nix eval --raw .#container.imageTag)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not name the version in Cargo.toml, $version"
            exit 1
          fi
      - name: Build the image
        run: nix build .#container
      - name: Push the image
        env:
          ARCH: ${{ matrix.arch }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        # The source is the archive this job built, so there is no signature
        # for a policy to check.
        run: |
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- --insecure-policy "$@"; }
          echo "$REGISTRY_PASSWORD" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          skopeo copy docker-archive:result "docker://ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}-$ARCH"

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write # checks out the repository and publishes the release
      packages: write # tags the image of both architectures
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build the API documents
        run: nix build .#contract
      - name: Tag the image of both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        # `latest` follows the newest release only, so publishing an older tag
        # again leaves it where it is.
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          published=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          tags=(--tag "$image:$version")
          if [ "$(printf '%s\n' "$TAG" "$published" | sort -V | tail -1)" = "$TAG" ]; then
            tags+=(--tag "$image:latest")
          fi
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker buildx imagetools create "${tags[@]}" "$image:$version-amd64" "$image:$version-arm64"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" result/management-api.openapi.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Afterimage ${TAG#v}" --draft=false
