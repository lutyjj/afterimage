<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1113" media="(prefers-color-scheme: dark)" />
    <title>Afterimage</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The theme a person chose (src/app/theme.ts owns the key, and its test
         holds this script to it), set before the stylesheet paints so a chosen
         theme never flashes the system's. The theme store then gives the
         theme-color above the chosen scheme's ground. -->
    <script>
      try {
        const theme = localStorage.getItem("afterimage.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
