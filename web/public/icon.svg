    <circle cx="36" cy="52" r="3.4"/>
    <circle cx="44" cy="52" r="3.6"/>
    <circle cx="52" cy="52" r="3.4"/>
    <circle cx="28" cy="60" r="2.1"/>
    <circle cx="36" cy="60" r="2.0"/>
    <circle cx="44" cy="60" r="3.4"/>
    <circle cx="52" cy="60" r="2.0"/>
    <circle cx="20" cy="68" r="2.1"/>
    <circle cx="28" cy="68" r="3.0"/>
    <circle cx="36" cy="68" r="2.1"/>
    <circle cx="12" cy="76" r="1.3"/>
    <circle cx="20" cy="76" r="1.3"/>
    <circle cx="28" cy="76" r="2.1"/>
    <circle cx="12" cy="84" r="1.3"/>
