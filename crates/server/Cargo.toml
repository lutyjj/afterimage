[package]
name = "afterimage-server"
description = "The Afterimage server: TRMNL's device API and the management API over SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "afterimage"
path = "src/main.rs"

[dependencies]
afterimage-device-api = { path = "../../gen/device-api" }
afterimage-management-api = { path = "../../gen/management-api", features = ["serde"] }
afterimage-render-typst = { path = "../render-typst" }
afterimage-trmnl = { path = "../trmnl" }

# Document, Number and Blob for generated shapes; Cargo unifies this 1.x requirement
# with the release the generated crates use. The smithy server runtime comes through
# the generated crates (`afterimage_device_api::server`), so codegen alone picks its
# version.
aws-smithy-types = "1.9.1"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
# Cookie parsing and Set-Cookie formatting. Nothing is signed: cookies carry opaque
# random tokens whose hashes the database holds.
cookie = "0.18.2"
# data: URLs in image components.
data-url = "0.3.2"
# The partition table of TRMNL's flash images, with its MD5 checked.
esp-idf-part = "0.6.0"
getrandom = "0.4.3"
http = "1.5.0"
# Local time for playlists; the time zone database is bundled so that a host or
# container without one still schedules correctly.
jiff = { version = "0.2.39", features = ["tzdb-bundle-always"] }
# Screen templates, with Jinja's filters for dates (in the server's time zone) and
# Python's string methods, as Home Assistant templates have them.
minijinja = { version = "3.0.5", features = ["fuel", "json", "loop_controls", "serde", "urlencode"] }
minijinja-contrib = { version = "3.0.5", features = ["datetime", "timezone", "pycompat"] }
http-body = "1.0.1"
hyper = "1.12.0"
# RustCrypto's argon2id with its default cost, as PHC strings the accounts table stores.
password-auth = "2.0.0"
# Data sources and images.
reqwest = "0.13.5"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
# Ordering TRMNL's firmware releases and telling variants (`1.7.8-sensors`) from them.
semver = "1.0.28"
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5.3", features = ["steer", "util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# A stand-in data source for the tests.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
png = "0.18.1"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json"] }
tempfile = "3"

[lints]
workspace = true
