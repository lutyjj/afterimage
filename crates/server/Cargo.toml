[package]
name = "afterimage-server"
description = "The Afterimage server: TRMNL's device API over SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "afterimage"
path = "src/main.rs"

[dependencies]
afterimage-device-api = { path = "../../gen/device-api" }
afterimage-trmnl = { path = "../trmnl" }

# Document and Number, to read log entries; Cargo unifies this 1.x requirement with
# the release the generated crate uses. The smithy server runtime comes through the
# generated crate (`afterimage_device_api::server`), so codegen alone picks its version.
aws-smithy-types = "1.9.1"
base64 = "0.23.1"
getrandom = "0.4.3"
sha2 = "0.11.1"
thiserror = "2.0.21"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
