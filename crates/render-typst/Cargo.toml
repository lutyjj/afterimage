[package]
name = "afterimage-render-typst"
description = "Draws a resolved Afterimage screen with Typst, in TRMNL's design tokens, as the image a display shows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
afterimage-trmnl = { path = "../trmnl" }

# The fonts tools/tokens copies, embedded at build time.
include_dir = "0.7.4"
png = "0.18.1"
# Rich text's Markdown, read into the blocks the Typst library draws.
pulldown-cmark = { version = "0.13.6", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.21"
# typst-render draws into tiny-skia's pixmap; this is the same release.
tiny-skia = "0.12.0"
typst = "0.15.1"
# Implements Typst's World over embedded sources and fonts.
typst-as-lib = "0.17.0"
typst-layout = "0.15.1"
typst-render = "0.15.1"

[lints]
workspace = true
